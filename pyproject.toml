[project]
name = "robogoat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.139.2", "uvicorn[standard]>=0.51.0"]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=9.1.1"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["webapp"]
